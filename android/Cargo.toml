[package]
name = "min-keyboard-android"
description = "The Min Keyboard Android input method, written in Rust over JNI"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "minkeyboard"
crate-type = ["cdylib", "rlib"]

[dependencies]
min-keyboard-engines = { path = "../engines" }
min-keyboard-grammar = { path = "../grammar" }

[workspace]
resolver = "2"
members = ["engines", "grammar", "android", "tools/apkbuild", "tools/dicttool"]

[workspace.package]
version = "0.3.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Dictionary loading is slow without optimisation; keep tests usable.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Rust tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        # Installs the version, components and Android targets pinned in rust-toolchain.toml.
        run: rustup show active-toolchain || rustup toolchain install
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Assemble debug APK
        # The runner image provides the Android SDK and NDK; no Java is used.
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo run --release -p apkbuild
      - uses: actions/upload-artifact@v4
        with:
          name: min-keyboard-debug-apk
          path: target/apk/min-keyboard.apk
          if-no-files-found: error

  linux:
    name: Linux edition tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s linux -v
